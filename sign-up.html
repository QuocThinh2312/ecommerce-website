<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore exclusive deals, flash sales, trending categories, and best-selling products at our online store. Shop quality products at great prices."
    />

    <title>Exclusive — Shop Smarter, Live Better</title>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="./assets/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="./assets/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="./assets/favicon/site.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Style -->
    <link rel="stylesheet" href="./assets/css/output.css" />

    <!-- Script -->
    <script type="module" src="./src/js/global.js"></script>
  </head>

  <body class="font-primary bg-secondary">
    <app-header active-menu="sign-up" hide-actions></app-header>

    <main class="relative mt-15">
      <div class="container flex items-center justify-end md:min-h-195">
        <div
          class="absolute top-0 left-0 hidden aspect-805/781 h-full w-[56%] md:block"
        >
          <img
            src="./assets/images/illustration.webp"
            alt=""
            aria-hidden="true"
            width="2415"
            height="2343"
            class="h-full w-full object-cover"
          />
        </div>

        <section class="mx-auto w-full max-w-125 md:m-0 md:w-[31.7%]">
          <header
            class="text-primary mb-8 flex flex-col gap-4 text-center md:mb-12 md:gap-6 md:text-left"
          >
            <h1 class="font-secondary text-3xl font-medium tracking-[0.04em]">
              Create an account
            </h1>
            <p class="text-base">Enter your details below</p>
          </header>

          <form
            action=""
            method="POST"
            class="text-primary flex flex-col gap-10 text-base"
          >
            <div>
              <label for="name" class="sr-only">Name</label>
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Name"
                required
                autocomplete="off"
                spellcheck="false"
                class="border-primary/50 placeholder:text-primary/40 focus:border-accent w-full border-b bg-transparent py-2 focus:outline-none"
              />
            </div>
            <div>
              <label for="contact" class="sr-only">Email or Phone Number</label>
              <input
                type="text"
                id="contact"
                name="contact"
                placeholder="Email or Phone Number"
                required
                autocomplete="off"
                spellcheck="false"
                class="border-primary/50 placeholder:text-primary/40 focus:border-accent w-full border-b bg-transparent py-2 focus:outline-none"
              />
            </div>
            <div>
              <label for="password" class="sr-only">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                required
                autocomplete="off"
                spellcheck="false"
                class="border-primary/50 placeholder:text-primary/40 focus:border-accent w-full border-b bg-transparent py-2 focus:outline-none"
              />
            </div>
            <div class="flex flex-col gap-4 text-base">
              <button
                type="submit"
                class="bg-accent text-foreground-inverse w-full rounded-sm py-4 font-medium transition-[scale] duration-300 select-none hover:opacity-80 active:scale-[0.96]"
              >
                Create Account
              </button>

              <button
                type="button"
                class="border-primary/40 text-primary hover:text-foreground-inverse hover:bg-primary flex w-full items-center justify-center gap-4 rounded-sm border py-4 transition-[scale] duration-300 select-none active:scale-[0.96]"
              >
                <img
                  src="./assets/icons/google.svg"
                  alt=""
                  aria-hidden="true"
                  class="h-6 w-6"
                />

                Sign up with Google
              </button>
            </div>
          </form>

          <div
            class="text-primary/70 mt-8.5 flex items-center justify-center gap-4 text-base"
          >
            <p>Already have account?</p>
            <a
              href="./sign-in.html"
              class="decoration-primary/50 font-medium underline decoration-1 underline-offset-8 hover:opacity-80"
            >
              Log in
            </a>
          </div>
        </section>
      </div>
    </main>

    <app-footer></app-footer>
  </body>
</html>
